name: macos-clean

options:
  bundleIdPrefix: com.goldenowl
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # A cleanup tool must reach other apps' caches, so the App Sandbox stays OFF.
    # Hardened Runtime is ON (required for notarization).
    ENABLE_HARDENED_RUNTIME: YES

packages:
  MacosCleanCore:
    path: Packages/MacosCleanCore

targets:
  macos-clean:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MacosCleanCore
    entitlements:
      path: App/macos-clean.entitlements
      properties:
        com.apple.security.app-sandbox: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: macOS Clean
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en]
        LSApplicationCategoryType: public.app-category.utilities
        NSDesktopFolderUsageDescription: >-
          macOS Clean scans your Desktop when you search your Home folder for large files or code-project leftovers. For example, it can show a large video on your Desktop so you can review and move it to the Trash.
        NSDocumentsFolderUsageDescription: >-
          macOS Clean scans your Documents folder when you search your Home folder for large files or code-project leftovers. For example, it can show a large exported project in Documents so you can review and move it to the Trash.
        NSDownloadsFolderUsageDescription: >-
          macOS Clean scans your Downloads folder to calculate file sizes and lets you move selected old downloads to the Trash. For example, it can show a large installer in Downloads so you can review and move it to the Trash.
        NSNetworkVolumesUsageDescription: >-
          macOS Clean scans a network volume only when you choose a folder on it in Large Files. For example, it can show large files on a mounted share so you can decide whether to move selected items to the Trash.
        NSRemovableVolumesUsageDescription: >-
          macOS Clean scans a removable drive only when you choose a folder on it in Large Files. For example, it can show large archive files on an external USB drive so you can review and move selected items to the Trash.
    settings:
      base:
        PRODUCT_NAME: macOS Clean
        PRODUCT_MODULE_NAME: MacosClean
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenowl.macos-clean
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: N8L3QK9894
      configs:
        # Ad-hoc locally. Note: Full Disk Access is tied to the code signature,
        # so an ad-hoc build may need FDA re-granted after each rebuild.
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
